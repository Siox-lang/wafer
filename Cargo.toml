[package]
name = "wafer"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Package and project tooling for Siox dies"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
semver = { version = "1", features = ["serde"] }
# Reuse language identifiers, not a second Siox parser or compiler pipeline.
siox = { git = "https://github.com/Siox-lang/sioxc.git", rev = "3274566d18a490d3bbcd6de82c28ab085afb2e5f", default-features = false }

